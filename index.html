<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Dual-AI Infinite Dialogue Playground</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .chat-scroll::-webkit-scrollbar { width: 6px; }
    .chat-scroll::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); }
    .chat-scroll::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 3px; }
    @keyframes pulse-slow { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .animate-pulse-slow { animation: pulse-slow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

  <!-- Header -->
  <header class="bg-slate-800/85 backdrop-blur border-b border-slate-700/60 sticky top-0 z-20 px-4 py-3 shadow-lg">
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-indigo-600/30 border border-indigo-500/40 rounded-xl text-indigo-400">
          <i class="fa-solid fa-comments text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight text-slate-100 flex items-center gap-2">
            Gemini Dual-AI Playground
            <span class="text-xs px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">Worker Mode</span>
          </h1>
          <p class="text-xs text-slate-400">Cloudflare Worker Proxy • 無限自動對話 • 人類自由對談</p>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <button id="btn-toggle-loop" class="px-3.5 py-1.5 text-xs font-semibold rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white shadow-sm transition flex items-center gap-1.5">
          <i class="fa-solid fa-play"></i> <span id="lbl-toggle-loop">開始自動對話</span>
        </button>
        <button id="btn-single-step" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 transition flex items-center gap-1">
          <i class="fa-solid fa-forward-step"></i> 單步觸發
        </button>
        <button id="btn-clear" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-700/80 hover:bg-red-900/40 hover:text-red-300 text-slate-300 transition flex items-center gap-1">
          <i class="fa-solid fa-trash-can"></i> 清除
        </button>
        <button id="btn-settings" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 transition flex items-center gap-1">
          <i class="fa-solid fa-gear"></i> 設定
        </button>
      </div>
    </div>
  </header>

  <!-- Main Grid -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 grid grid-cols-1 md:grid-cols-4 gap-4 overflow-hidden">

    <!-- Left Controls -->
    <aside class="md:col-span-1 flex flex-col gap-4">
      <div class="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-4 shadow-sm">
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
            <i class="fa-solid fa-server text-indigo-400"></i> Worker 狀態
          </h2>
          <span id="status-badge" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-slate-700 text-slate-300">檢查中...</span>
        </div>
        <div class="text-xs text-slate-400 truncate font-mono bg-slate-900/60 p-2 rounded border border-slate-800" id="current-worker-display">...</div>
      </div>

      <div class="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-4 shadow-sm flex-1 flex flex-col gap-3">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
          <i class="fa-solid fa-sliders text-indigo-400"></i> 運行狀態
        </h2>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <div class="bg-slate-900/40 p-2.5 rounded-xl border border-slate-800">
            <div class="text-slate-400 text-[10px]">當前回合</div>
            <div id="display-current-turn" class="text-base font-bold text-indigo-400 mt-0.5">AI A (藍)</div>
          </div>
          <div class="bg-slate-900/40 p-2.5 rounded-xl border border-slate-800">
            <div class="text-slate-400 text-[10px]">總對話數</div>
            <div id="display-msg-count" class="text-base font-bold text-slate-200 mt-0.5">0</div>
          </div>
        </div>
        <div class="text-xs space-y-2 mt-1">
          <div>
            <label class="text-slate-400 text-[11px] block mb-1">自動發言間隔 (秒): <span id="delay-val" class="text-slate-200 font-semibold">3</span>s</label>
            <input type="range" id="input-delay" min="1" max="10" value="3" class="w-full accent-indigo-500 bg-slate-700 h-1.5 rounded-lg appearance-none cursor-pointer">
          </div>
          <div class="pt-2 border-t border-slate-700/60">
            <label class="text-slate-400 text-[11px] block mb-1">初次對話主題 / 開場白</label>
            <textarea id="input-seed" rows="3" class="w-full text-xs p-2.5 bg-slate-900/80 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-slate-200 resize-none">你好！我們今天來聊聊 AI 發展對人類社會的未來影響吧。</textarea>
          </div>
        </div>
      </div>
    </aside>

    <!-- Right Chat Area -->
    <section class="md:col-span-3 bg-slate-800/60 border border-slate-700/80 rounded-2xl flex flex-col overflow-hidden shadow-sm">
      <div class="px-4 py-2.5 bg-slate-800/90 border-b border-slate-700/80 flex items-center justify-between text-xs text-slate-400">
        <div class="flex items-center space-x-3">
          <span class="flex items-center gap-1.5 text-indigo-400 font-medium"><span class="w-2.5 h-2.5 rounded-full bg-indigo-500 inline-block"></span> AI A</span>
          <span>⇄</span>
          <span class="flex items-center gap-1.5 text-emerald-400 font-medium"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span> AI B</span>
        </div>
        <div id="typing-indicator" class="hidden items-center gap-2 text-indigo-300 animate-pulse-slow">
          <i class="fa-solid fa-circle-notch fa-spin"></i>
          <span id="typing-text" class="text-[11px]">AI 正在思考中...</span>
        </div>
      </div>

      <div id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-4 chat-scroll"></div>

      <div class="p-3 bg-slate-900/80 border-t border-slate-700/80 flex gap-2 items-center">
        <input type="text" id="human-input" class="flex-1 text-xs sm:text-sm bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition" placeholder="人類參與對話... 輸入訊息插話">
        <button id="btn-send-human" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold transition flex items-center gap-1.5">
          <i class="fa-solid fa-paper-plane"></i> 發送
        </button>
      </div>
    </section>
  </main>

  <!-- Settings Modal -->
  <div id="modal-settings" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl">
      <div class="px-5 py-4 border-b border-slate-700 flex justify-between items-center">
        <h3 class="font-bold text-base text-slate-100 flex items-center gap-2"><i class="fa-solid fa-sliders text-indigo-400"></i> 設定</h3>
        <button id="btn-close-modal" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="p-5 space-y-4 text-xs">
        <div>
          <label class="block font-semibold text-slate-300 mb-1">Cloudflare Worker Proxy URL</label>
          <input type="url" id="setting-worker-url" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-200 font-mono focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block font-semibold text-indigo-300 mb-1">AI A 角色設定</label>
          <textarea id="setting-persona-a" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-slate-200 focus:outline-none focus:border-indigo-500 resize-none"></textarea>
        </div>
        <div>
          <label class="block font-semibold text-emerald-300 mb-1">AI B 角色設定</label>
          <textarea id="setting-persona-b" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-slate-200 focus:outline-none focus:border-emerald-500 resize-none"></textarea>
        </div>
      </div>
      <div class="px-5 py-3 bg-slate-900/60 border-t border-slate-700 flex justify-end">
        <button id="btn-save-settings" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-semibold text-xs transition">儲存設定</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const DEFAULT_WORKER_URL = "https://orange-water-91fc.allanfan2008.workers.dev/";

      const state = {
        workerUrl: localStorage.getItem("workerUrl") || DEFAULT_WORKER_URL,
        personaA: localStorage.getItem("personaA") || "你是一位樂觀、有創見且條理分明的專家。",
        personaB: localStorage.getItem("personaB") || "你是一位嚴謹、抱持批判思維且喜歡追問細節的質疑者。",
        isLooping: false,
        isThinking: false,
        currentTurn: "A",
        messages: [],
        delaySec: 3,
        loopTimer: null
      };

      const el = {
        chatBox: document.getElementById("chat-box"),
        btnToggleLoop: document.getElementById("btn-toggle-loop"),
        lblToggleLoop: document.getElementById("lbl-toggle-loop"),
        btnSingleStep: document.getElementById("btn-single-step"),
        btnClear: document.getElementById("btn-clear"),
        btnSettings: document.getElementById("btn-settings"),
        modalSettings: document.getElementById("modal-settings"),
        btnCloseModal: document.getElementById("btn-close-modal"),
        btnSaveSettings: document.getElementById("btn-save-settings"),
        settingWorkerUrl: document.getElementById("setting-worker-url"),
        settingPersonaA: document.getElementById("setting-persona-a"),
        settingPersonaB: document.getElementById("setting-persona-b"),
        currentWorkerDisplay: document.getElementById("current-worker-display"),
        statusBadge: document.getElementById("status-badge"),
        displayCurrentTurn: document.getElementById("display-current-turn"),
        displayMsgCount: document.getElementById("display-msg-count"),
        inputDelay: document.getElementById("input-delay"),
        delayVal: document.getElementById("delay-val"),
        inputSeed: document.getElementById("input-seed"),
        typingIndicator: document.getElementById("typing-indicator"),
        typingText: document.getElementById("typing-text"),
        humanInput: document.getElementById("human-input"),
        btnSendHuman: document.getElementById("btn-send-human")
      };

      function init() {
        el.settingWorkerUrl.value = state.workerUrl;
        el.settingPersonaA.value = state.personaA;
        el.settingPersonaB.value = state.personaB;
        updateWorkerDisplay();
        renderMessages();
      }

      function updateWorkerDisplay() {
        if (state.workerUrl) {
          el.currentWorkerDisplay.textContent = state.workerUrl;
          el.statusBadge.textContent = "已連線";
          el.statusBadge.className = "inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
        } else {
          el.currentWorkerDisplay.textContent = "未設定";
          el.statusBadge.textContent = "未設定";
          el.statusBadge.className = "inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-red-500/20 text-red-300 border border-red-500/30";
        }
      }

      function renderMessages() {
        el.chatBox.innerHTML = "";
        if (state.messages.length === 0) {
          el.chatBox.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-slate-500 text-xs py-12"><i class="fa-solid fa-comments text-4xl mb-3 opacity-30"></i><p>點擊「開始自動對話」啟動雙 AI 交流。</p></div>`;
          el.displayMsgCount.textContent = "0";
          return;
        }

        state.messages.forEach(msg => {
          const isA = msg.role === "A";
          let bubbleBg = isA ? "bg-indigo-950/40 text-indigo-100 border-indigo-700/50" : (msg.role === "B" ? "bg-emerald-950/40 text-emerald-100 border-emerald-700/50" : "bg-slate-800 text-slate-200 border-slate-700");
          let roleBadge = isA ? "AI A" : (msg.role === "B" ? "AI B" : "人類");
          let badgeStyle = isA ? "bg-indigo-500/20 text-indigo-300 border-indigo-500/30" : (msg.role === "B" ? "bg-emerald-500/20 text-emerald-300 border-emerald-500/30" : "bg-purple-500/20 text-purple-300 border-purple-500/30");
          let alignClass = isA ? "justify-start" : (msg.role === "B" ? "justify-end" : "justify-center");

          const div = document.createElement("div");
          div.className = `flex ${alignClass} mb-3`;
          div.innerHTML = `<div class="max-w-[85%] border ${bubbleBg} rounded-2xl p-3.5 shadow-sm space-y-1.5"><div class="flex items-center justify-between gap-3 text-[11px]"><span class="px-2 py-0.5 rounded-full border text-[10px] font-semibold ${badgeStyle}">${roleBadge}</span><span class="text-slate-500">${msg.time}</span></div><div class="text-xs sm:text-sm whitespace-pre-wrap leading-relaxed">${escapeHtml(msg.text)}</div></div>`;
          el.chatBox.appendChild(div);
        });

        el.displayMsgCount.textContent = state.messages.length;
        el.chatBox.scrollTop = el.chatBox.scrollHeight;
      }

      function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      async function fetchGeminiResponse(agentType, retryCount = 3) {
        if (!state.workerUrl) throw new Error("請先設定 Worker 網址");
        const persona = agentType === "A" ? state.personaA : state.personaB;
        const contents = [
          { role: "user", parts: [{ text: `[System Instruction]: ${persona}` }] },
          { role: "model", parts: [{ text: "了解。" }] }
        ];

        state.messages.slice(-2).forEach(msg => {
          contents.push({
            role: msg.role === agentType ? "model" : "user",
            parts: [{ text: `${msg.role === 'Human' ? '[人類]' : ''}${msg.text}` }]
          });
        });

        if (contents.length <= 2) {
          contents.push({ role: "user", parts: [{ text: el.inputSeed.value.trim() || "開始對話" }] });
        }

        try {
          const res = await fetch(state.workerUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-Agent-Type": agentType },
            body: JSON.stringify({ contents })
          });

          if (!res.ok) {
            const errText = await res.text();
            throw new Error(`HTTP 錯誤 ${res.status}: ${errText}`);
          }

          // 準備一個空的訊息物件用來即時塞入串流文字
          const newMessage = {
            id: Date.now(),
            role: agentType,
            text: "",
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
          };
          state.messages.push(newMessage);
          renderMessages();

          // 讀取 SSE 串流資料
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop(); // 保留未完成的行

			for (const line of lines) {
              const trimmed = line.trim();
              if (trimmed.startsWith("data:")) {
                const jsonStr = trimmed.substring(5).trim();
                if (jsonStr) {
                  // 如果遇到串流結束訊號 [DONE]，跳過
                  if (jsonStr === "[DONE]") continue;
                  try {
                    const chunk = JSON.parse(jsonStr);
                    // 兼容多種 Google API 回應路徑
                    const chunkText = 
                      chunk.candidates?.[0]?.content?.parts?.[0]?.text || 
                      chunk.text || 
                      "";

                    if (chunkText) {
                      newMessage.text += chunkText;
                      renderMessages(); // 即時更新畫面文字
                    }
                  } catch (e) {
                    console.warn("解析串流 JSON 失敗", e);
                  }
                }
              }
            }            
          }

          if (!newMessage.text) {
            throw new Error("串流回應內容空值");
          }

          // 💡 修正點：直接回傳空字串，因為訊息已經在串流中透過 state.messages.push 即時寫入了！
          return "";

        } catch (err) {
          if (retryCount > 0 && (err.message.includes("high demand") || err.message.includes("network"))) {
            state.messages.pop(); // 移除失敗的空訊息
            await new Promise(resolve => setTimeout(resolve, 3000));
            return fetchGeminiResponse(agentType, retryCount - 1);
          }
          throw err;
        }
      }

      async function triggerNextTurn() {
        if (state.isThinking) return;
        state.isThinking = true;
        const target = state.currentTurn;

        el.typingText.textContent = `AI ${target} 正在思考...`;
        el.typingIndicator.classList.remove("hidden");
        el.typingIndicator.classList.add("flex");

        try {
          // 呼叫串流函式，文字會直接即時寫入 state.messages
          await fetchGeminiResponse(target);
          
          // 切換下一回合角色
          state.currentTurn = target === "A" ? "B" : "A";
          el.displayCurrentTurn.textContent = state.currentTurn === "A" ? "AI A (藍)" : "AI B (綠)";
          renderMessages();
        } catch (err) {
          console.error(err);
          alert(`錯誤: ${err.message}`);
          stopLoop();
        } finally {
          state.isThinking = false;
          el.typingIndicator.classList.add("hidden");
          el.typingIndicator.classList.remove("flex");
        }
      }

      async function runLoopCycle() {
        if (!state.isLooping) return;
        await triggerNextTurn();
        if (state.isLooping) {
          state.loopTimer = setTimeout(runLoopCycle, state.delaySec * 1000);
        }
      }

      function startLoop() {
        state.isLooping = true;
        el.lblToggleLoop.textContent = "暫停自動對話";
        el.btnToggleLoop.className = "px-3.5 py-1.5 text-xs font-semibold rounded-lg bg-amber-600 hover:bg-amber-500 text-white shadow-sm transition flex items-center gap-1.5";
        el.btnToggleLoop.querySelector("i").className = "fa-solid fa-pause";
        runLoopCycle();
      }

      function stopLoop() {
        state.isLooping = false;
        if (state.loopTimer) clearTimeout(state.loopTimer);
        el.lblToggleLoop.textContent = "開始自動對話";
        el.btnToggleLoop.className = "px-3.5 py-1.5 text-xs font-semibold rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white shadow-sm transition flex items-center gap-1.5";
        el.btnToggleLoop.querySelector("i").className = "fa-solid fa-play";
      }

      // Event Listeners
      el.btnToggleLoop.addEventListener("click", () => {
        if (state.isLooping) stopLoop();
        else startLoop();
      });

      el.btnSingleStep.addEventListener("click", () => {
        stopLoop();
        triggerNextTurn();
      });

      el.btnClear.addEventListener("click", () => {
        stopLoop();
        state.messages = [];
        state.currentTurn = "A";
        el.displayCurrentTurn.textContent = "AI A (藍)";
        renderMessages();
      });

      el.btnSettings.addEventListener("click", () => el.modalSettings.classList.remove("hidden"));
      el.btnCloseModal.addEventListener("click", () => el.modalSettings.classList.add("hidden"));

      el.btnSaveSettings.addEventListener("click", () => {
        state.workerUrl = el.settingWorkerUrl.value.trim();
        state.personaA = el.settingPersonaA.value.trim();
        state.personaB = el.settingPersonaB.value.trim();
        localStorage.setItem("workerUrl", state.workerUrl);
        localStorage.setItem("personaA", state.personaA);
        localStorage.setItem("personaB", state.personaB);
        updateWorkerDisplay();
        el.modalSettings.classList.add("hidden");
      });

      el.inputDelay.addEventListener("input", (e) => {
        state.delaySec = parseInt(e.target.value, 10);
        el.delayVal.textContent = state.delaySec;
      });

      function sendHuman() {
        const text = el.humanInput.value.trim();
        if (!text) return;
        state.messages.push({ id: Date.now(), role: "Human", text, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
        el.humanInput.value = "";
        renderMessages();
        if (!state.isThinking) triggerNextTurn();
      }

      el.btnSendHuman.addEventListener("click", sendHuman);
      el.humanInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendHuman(); });

      init();
    });
  </script>
</body>
</html>
